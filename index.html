<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bulk Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#e8ff00;--primary-dark:#c8dd00;--bg:#0a0a0a;--card:#151515;--card-border:#252525;--text:#f0f0f0;--text-light:#777;--border:#2a2a2a;--danger:#ff3b5c;--success:#e8ff00;--dot-color:rgba(255,255,255,.08)}
html{overflow-x:hidden}
body{font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(circle,var(--dot-color) 1px,transparent 1px);background-size:20px 20px;z-index:0;pointer-events:none}
.header{background:var(--bg);border-bottom:1px solid var(--border);color:var(--primary);padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.header-btn{background:transparent;border:1.5px solid var(--primary);color:var(--primary);padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.95);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:calc(env(safe-area-inset-bottom, 20px) + 4px);backdrop-filter:blur(12px)}
.tab-bar button{flex:1;border:none;background:none;padding:10px 0 8px;font-size:10px;font-weight:600;color:var(--text-light);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.5px;text-transform:uppercase}
.tab-bar button.active{color:var(--primary)}
.tab-bar button svg{width:22px;height:22px}
.page{display:none;padding:16px;position:relative;z-index:1}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:1px;color:var(--text)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text-light);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;background:#111;color:var(--text);-webkit-appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(232,255,0,.15)}
textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border:none;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;width:100%;font-family:inherit;text-transform:uppercase;letter-spacing:.5px}
.btn-primary{background:var(--primary);color:#0a0a0a}
.btn-primary:active{background:var(--primary-dark)}
.btn-secondary{background:#1a1a1a;color:var(--text);border:1.5px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px;width:auto}
.btn-group{display:flex;gap:8px}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;border:1.5px solid var(--border);background:#1a1a1a;color:var(--text-light);cursor:pointer;transition:.15s}
.chip.active{border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.set-row input{flex:1}
.set-label{font-size:13px;font-weight:700;color:var(--text-light);min-width:50px;text-align:center}
.record-item{padding:14px 0;border-bottom:1px solid var(--border)}
.record-item:last-child{border-bottom:none}
.record-date{font-size:12px;color:var(--text-light);margin-bottom:4px;font-weight:600}
.record-exercise{font-size:15px;font-weight:700}
.record-detail{font-size:13px;color:var(--text-light);margin-top:2px}
.record-memo{font-size:13px;color:var(--text);margin-top:6px;padding:8px;background:#111;border-radius:8px;border:1px solid var(--border)}
.record-photo{width:100%;max-width:200px;border-radius:8px;margin-top:8px}
.record-actions{display:flex;gap:4px}
.record-actions button{background:none;border:none;font-size:16px;cursor:pointer;padding:4px 8px}
.edit-btn{color:var(--primary)}
.stat-value{font-size:28px;font-weight:900;color:var(--primary)}
.stat-label{font-size:11px;color:var(--text-light);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{text-align:center;padding:40px 20px;color:var(--text-light);font-size:14px}
.delete-btn{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px}
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:800;margin-right:4px;text-transform:uppercase;letter-spacing:.5px}
.photo-input-wrap{position:relative}
.photo-input-wrap input[type=file]{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer}
.photo-preview{width:60px;height:60px;border-radius:8px;object-fit:cover;margin-right:8px}
.chart-container{width:100%;height:200px;position:relative}
canvas{width:100%!important;height:100%!important}
.filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.filter-row::-webkit-scrollbar{display:none}
.body-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.body-row input{flex:1}
.body-row .body-label{font-size:13px;min-width:70px;color:var(--text-light);font-weight:700}
.date-nav{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:16px}
.date-nav button{background:none;border:none;font-size:20px;color:var(--primary);cursor:pointer;padding:4px 10px}
.date-nav span{font-size:15px;font-weight:800;letter-spacing:1px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header button{background:none;border:none;font-size:20px;color:var(--primary);cursor:pointer;padding:4px 12px}
.cal-header span{font-size:16px;font-weight:800;letter-spacing:1px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:11px;font-weight:700;color:var(--text-light);padding:6px 0;text-transform:uppercase}
.cal-day{position:relative;padding:8px 0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.15s}
.cal-day:active{background:#1a1a1a}
.cal-day.today{font-weight:900;color:var(--primary)}
.cal-day.selected{background:var(--primary);color:#0a0a0a;border-radius:8px}
.cal-day.selected .cal-dots span{background:#0a0a0a}
.cal-day.other-month{color:#333}
.cal-dots{display:flex;gap:2px;justify-content:center;min-height:6px}
.cal-dots span{width:5px;height:5px;border-radius:50%}
.cal-detail{margin-top:16px}
.cal-detail-header{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.cal-streak{display:flex;gap:16px;justify-content:center;padding:4px 0}
.cal-streak-item{text-align:center}
.cal-streak-num{font-size:22px;font-weight:900;color:var(--primary)}
.cal-streak-label{font-size:11px;color:var(--text-light);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.suggestions{background:var(--card);border:1.5px solid var(--border);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.suggestion-item{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:active{background:#1a1a1a}
.suggestion-item .sg-part{font-size:11px;color:var(--text-light);font-weight:600}
.last-menu-item{padding:10px 12px;margin-bottom:6px;background:#111;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s}
.last-menu-item:active{transform:scale(.98);opacity:.8}
.last-menu-item .lm-name{font-size:14px;font-weight:700}
.last-menu-item .lm-detail{font-size:12px;color:var(--text-light);margin-top:2px}
.last-menu-item .lm-date{font-size:11px;color:var(--text-light);float:right}
.edit-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.edit-modal-content{background:var(--card);border:1px solid var(--card-border);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}
.edit-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.edit-modal-header h3{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.edit-modal-close{background:none;border:none;color:var(--text-light);font-size:24px;cursor:pointer;padding:4px 8px}
@keyframes fadeout{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

<div class="header">
  <h1>Bulk Tracker</h1>
  <button class="header-btn" onclick="exportData()">Export</button>
</div>

<div id="page-record" class="page active">
  <div class="date-nav">
    <button onclick="changeDate(-1)">&lt;</button>
    <span id="current-date"></span>
    <button onclick="changeDate(1)">&gt;</button>
  </div>
  <div class="card">
    <div class="card-title">Category</div>
    <div class="chip-group" id="part-chips"></div>
  </div>
  <div class="card" id="last-menu-card" style="display:none">
    <div class="card-title">Last Menu <span id="last-menu-part" style="font-size:12px;color:var(--text-light);font-weight:400"></span></div>
    <div id="last-menu-list"></div>
  </div>

  <div class="card">
    <div class="card-title">Exercise</div>
    <div class="form-group" style="position:relative">
      <input type="text" id="exercise-name" placeholder="種目名を入力 or 下から選択" autocomplete="off" onfocus="showSuggestions()" oninput="showSuggestions()">
      <div id="exercise-suggestions" style="display:none"></div>
    </div>
    <div id="sets-container"></div>
    <button class="btn btn-secondary btn-sm" id="add-set-btn" onclick="addSet()" style="margin-top:8px">+ Set</button>
  </div>
  <div class="card">
    <div class="card-title">Memo / Photo</div>
    <div class="form-group">
      <textarea id="record-memo" placeholder="メモ（任意）"></textarea>
    </div>
    <div class="form-group">
      <div class="photo-input-wrap">
        <button class="btn btn-secondary btn-sm">+ Photo</button>
        <input type="file" accept="image/*" capture="environment" onchange="handlePhoto(this)">
      </div>
      <div id="photo-preview-area" style="margin-top:8px;display:flex;flex-wrap:wrap"></div>
    </div>
  </div>
  <button class="btn btn-primary" id="save-record-btn" onclick="saveRecord()">Save Record</button>
  <div style="margin-top:20px">
    <div class="card">
      <div class="card-title">Today <span id="today-count" style="font-size:12px;color:var(--text-light);font-weight:400;text-transform:none;letter-spacing:0"></span></div>
      <div id="today-records"></div>
    </div>
  </div>
</div>

<div id="page-calendar" class="page">
  <div class="card">
    <div class="cal-streak" id="cal-streak"></div>
  </div>
  <div class="card">
    <div class="cal-header">
      <button onclick="changeCalMonth(-1)">&lt;</button>
      <span id="cal-month-label"></span>
      <button onclick="changeCalMonth(1)">&gt;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div class="cal-detail" id="cal-detail"></div>
</div>

<div id="page-body" class="page">
  <div class="card">
    <div class="card-title">Body Composition</div>
    <div class="body-row">
      <span class="body-label">体重</span>
      <input type="number" id="body-weight" placeholder="kg" step="0.1">
      <span style="font-size:14px;color:var(--text-light);min-width:20px">kg</span>
    </div>
    <div class="body-row">
      <span class="body-label">体脂肪率</span>
      <input type="number" id="body-fat" placeholder="%" step="0.1">
      <span style="font-size:14px;color:var(--text-light);min-width:20px">%</span>
    </div>
    <button class="btn btn-primary" onclick="saveBody()" style="margin-top:12px">Record</button>
  </div>
  <div class="card">
    <div class="card-title">Weight</div>
    <div class="chart-container"><canvas id="weight-chart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Body Fat %</div>
    <div class="chart-container"><canvas id="fat-chart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">History</div>
    <div id="body-history"></div>
  </div>
</div>

<div id="page-history" class="page">
  <div class="filter-row" id="history-filter"></div>
  <div id="history-list"></div>
</div>

<div id="page-stats" class="page">
  <div class="card">
    <div class="card-title">Weekly <span id="week-range" style="font-size:11px;color:var(--text-light);font-weight:400;text-transform:none;letter-spacing:0"></span></div>
    <div class="stat-grid">
      <div><div class="stat-value" id="week-days">0</div><div class="stat-label">Days</div></div>
      <div><div class="stat-value" id="week-sets">0</div><div class="stat-label">Sets</div></div>
      <div><div class="stat-value" id="week-volume">0</div><div class="stat-label">Volume(kg)</div></div>
      <div><div class="stat-value" id="week-cardio">0</div><div class="stat-label">Cardio(min)</div></div>
    </div>
    <div id="week-parts" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>
  <div class="card">
    <div class="card-title">Monthly</div>
    <div class="stat-grid">
      <div><div class="stat-value" id="stat-days">0</div><div class="stat-label">Days</div></div>
      <div><div class="stat-value" id="stat-sets">0</div><div class="stat-label">Sets</div></div>
      <div><div class="stat-value" id="stat-volume">0</div><div class="stat-label">Volume(kg)</div></div>
      <div><div class="stat-value" id="stat-exercises">0</div><div class="stat-label">Exercises</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Volume by Part</div>
    <div class="chart-container"><canvas id="part-chart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Weekly Sessions</div>
    <div class="chart-container"><canvas id="weekly-chart"></canvas></div>
  </div>
</div>

<div id="page-settings" class="page">
  <div class="card">
    <div class="card-title">Categories</div>
    <div id="parts-list"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input type="text" id="new-part-name" placeholder="新しい部位名">
      <button class="btn btn-primary btn-sm" onclick="addPart()">Add</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Exercises</div>
    <div id="exercises-list"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input type="text" id="new-exercise-name" placeholder="種目名">
      <select id="new-exercise-part" style="width:120px"></select>
      <button class="btn btn-primary btn-sm" onclick="addExercise()">Add</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Data</div>
    <div class="btn-group" style="flex-direction:column">
      <button class="btn btn-secondary" onclick="exportData()">JSON Export</button>
      <label class="btn btn-secondary" style="position:relative">
        JSON Import
        <input type="file" accept=".json" onchange="importData(this)" style="position:absolute;opacity:0;width:100%;height:100%">
      </label>
      <button class="btn btn-danger" onclick="clearAllData()">Delete All</button>
    </div>
  </div>
</div>

<div id="edit-modal" class="edit-modal" style="display:none" onclick="if(event.target===this)closeEditModal()"></div>

<nav class="tab-bar">
  <button class="active" onclick="switchPage('record')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Record
  </button>
  <button onclick="switchPage('calendar')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Calendar
  </button>
  <button onclick="switchPage('body')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Body
  </button>
  <button onclick="switchPage('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.18 2.18L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
    History
  </button>
  <button onclick="switchPage('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    Stats
  </button>
  <button onclick="switchPage('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Settings
  </button>
</nav>

<script>
var DB_KEY = 'gym-tracker-v1';
var PART_COLOR_MAP = {
  '胸': '#e8ff00',
  '背中': '#00e5ff',
  '肩': '#ff6b35',
  '腕': '#bf5af2',
  '脚': '#30d158',
  '腹': '#ff375f',
  '有酸素': '#64d2ff'
};
var FALLBACK_COLORS = ['#ffd60a','#ff9f0a','#ff453a','#bf5af2','#30d158','#64d2ff','#5e5ce6','#ac8e68','#ff6482','#00c7be'];
var PAGE_LIST = ['record','calendar','body','history','stats','settings'];

var state = loadState();
var currentDate = new Date();
var selectedPart = null;
var currentPhotos = [];
var setCount = 3;
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();
var calSelectedDate = null;
var editingRecordId = null;

function getPartColor(part) {
  if (PART_COLOR_MAP[part]) return PART_COLOR_MAP[part];
  var idx = state.parts.indexOf(part);
  if (idx < 0) idx = 0;
  return FALLBACK_COLORS[idx % FALLBACK_COLORS.length];
}

function getPartBg(part) {
  var c = getPartColor(part);
  return c.replace('#', '');
}

function hexToRgba(hex, a) {
  hex = hex.replace('#', '');
  var r = parseInt(hex.substring(0,2), 16);
  var g = parseInt(hex.substring(2,4), 16);
  var b = parseInt(hex.substring(4,6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function loadState() {
  try {
    var saved = localStorage.getItem(DB_KEY);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return {
    parts: ['胸','背中','肩','腕','脚','腹','有酸素'],
    exercises: [
      {name:'ベンチプレス',part:'胸'},{name:'ダンベルフライ',part:'胸'},{name:'インクラインプレス',part:'胸'},
      {name:'デッドリフト',part:'背中'},{name:'ラットプルダウン',part:'背中'},{name:'ベントオーバーロウ',part:'背中'},
      {name:'ショルダープレス',part:'肩'},{name:'サイドレイズ',part:'肩'},{name:'フロントレイズ',part:'肩'},
      {name:'アームカール',part:'腕'},{name:'トライセプスエクステンション',part:'腕'},
      {name:'スクワット',part:'脚'},{name:'レッグプレス',part:'脚'},{name:'レッグカール',part:'脚'},
      {name:'クランチ',part:'腹'},{name:'プランク',part:'腹'},{name:'レッグレイズ',part:'腹'},
      {name:'ランニング',part:'有酸素'},{name:'バイク',part:'有酸素'},{name:'ウォーキング',part:'有酸素'},{name:'縄跳び',part:'有酸素'}
    ],
    records: [],
    bodyRecords: []
  };
}

function save() { try { localStorage.setItem(DB_KEY, JSON.stringify(state)); } catch(e) { alert('保存容量の上限に達しました。古い写真付き記録を削除してください。'); } }

function fmt(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtDisplay(d) {
  var w = ['日','月','火','水','木','金','土'];
  return (d.getMonth()+1) + '/' + d.getDate() + '(' + w[d.getDay()] + ')';
}

function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function formatSets(r) {
  if (r.sets.length > 0 && r.sets[0].unit === 'cardio') {
    var s = r.sets[0];
    var parts = [];
    if (s.reps) parts.push(s.reps + '分');
    if (s.weight) parts.push(s.weight + 'km');
    return parts.join(' / ') || '-';
  }
  return r.sets.map(function(s, i) { return (i+1) + 'set: ' + s.weight + 'kg x ' + s.reps + '回'; }).join(' / ');
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  var btns = document.querySelectorAll('.tab-bar button');
  for (var i = 0; i < btns.length; i++) {
    if (i === PAGE_LIST.indexOf(name)) {
      btns[i].classList.add('active');
    } else {
      btns[i].classList.remove('active');
    }
  }
  if (name === 'record') renderRecordPage();
  if (name === 'calendar') renderCalendar();
  if (name === 'body') renderBody();
  if (name === 'history') renderHistory();
  if (name === 'stats') renderStats();
  if (name === 'settings') renderSettings();
}

function changeDate(dir) {

function renderRecordPage() {

function renderPartChips() {

function renderLastMenu() {
  var card = document.getElementById('last-menu-card');
  var list = document.getElementById('last-menu-list');
  var partLabel = document.getElementById('last-menu-part');

  if (!selectedPart) {
    card.style.display = 'none';
    return;
  }

  var partRecs = state.records.filter(function(r) { return r.part === selectedPart; });
  if (partRecs.length === 0) {
    card.style.display = 'none';
    return;
  }

  var latestDate = '';
  partRecs.forEach(function(r) { if (r.date > latestDate) latestDate = r.date; });
  var lastSession = partRecs.filter(function(r) { return r.date === latestDate; });

  var d = new Date(latestDate + 'T00:00:00');
  var wNames = ['日','月','火','水','木','金','土'];
  var dateLabel = (d.getMonth()+1) + '/' + d.getDate() + '(' + wNames[d.getDay()] + ')';

  partLabel.textContent = dateLabel;
  card.style.display = '';

  list.innerHTML = lastSession.map(function(r) {
    var setsText = formatSets(r);
    var setsJson = JSON.stringify(r.sets).replace(/'/g, "\\'");
    return '<div class="last-menu-item" onclick="applyLastMenu(\'' + r.exercise.replace(/'/g, "\\'") + '\', \'' + setsJson + '\')">' +
      '<div class="lm-name">' + r.exercise + '</div>' +
      '<div class="lm-detail">' + setsText + '</div>' +
      '</div>';
  }).join('');
}

function applyLastMenu(exercise, setsJson) {

function pickExercise(name) {
  document.getElementById('exercise-name').value = name;
  document.getElementById('exercise-suggestions').style.display = 'none';

  var ex = state.exercises.find(function(e) { return e.name === name; });
  if (ex && !selectedPart) {

    renderPartChips();
  }

  var lastRec = null;
  for (var i = state.records.length - 1; i >= 0; i--) {

  }
  if (lastRec) {
    setCount = lastRec.sets.length;
    renderSets();
    for (var j = 0; j < lastRec.sets.length; j++) {
      document.getElementById('weight-' + (j+1)).value = lastRec.sets[j].weight || '';
      document.getElementById('reps-' + (j+1)).value = lastRec.sets[j].reps || '';

function handlePhoto(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxW = 800, maxH = 800;
      var w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        var ratio = Math.min(maxW / w, maxH / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.6);
      currentPhotos.push(compressed);
      renderPhotoPreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function renderPhotoPreview() {
  var area = document.getElementById('photo-preview-area');
  area.innerHTML = currentPhotos.map(function(p, i) {
    return '<div style="position:relative;display:inline-block"><img src="' + p + '" class="photo-preview"><button onclick="removePhoto(' + i + ')" style="position:absolute;top:-6px;right:-2px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer">x</button></div>';
  }).join('');
}

}

function saveRecord() {
  var name = document.getElementById('exercise-name').value.trim();
  if (!name) { alert('種目名を入力してください'); return; }

  var sets = [];
  if (isCardio()) {
    var mins = parseFloat(document.getElementById('cardio-min').value) || 0;
    var km = parseFloat(document.getElementById('cardio-km').value) || 0;
    if (mins === 0 && km === 0) { alert('時間または距離を入力してください'); return; }
    sets.push({ weight: km, reps: mins, unit: 'cardio' });
  } else {
    for (var i = 1; i <= setCount; i++) {
      var w = parseFloat(document.getElementById('weight-' + i).value) || 0;
      var r = parseInt(document.getElementById('reps-' + i).value) || 0;
      if (w > 0 || r > 0) sets.push({ weight: w, reps: r });
    }
    if (sets.length === 0) { alert('少なくとも1セット入力してください'); return; }
  }

  var part = selectedPart || (state.exercises.find(function(e) { return e.name === name; }) || {}).part || '未分類';
  var memo = document.getElementById('record-memo').value.trim();

  state.records.push({
    id: Date.now(),
    date: fmt(currentDate),
    exercise: name,
    part: part,
    sets: sets,
    memo: memo,
    photos: currentPhotos.slice(),
    createdAt: new Date().toISOString()
  });

  if (!state.exercises.find(function(e) { return e.name === name; })) {
    state.exercises.push({ name: name, part: part });
  }

  save();
  resetForm();
  renderTodayRecords();

  var toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--primary);color:#0a0a0a;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:800;z-index:300;animation:fadeout 2s forwards;letter-spacing:.5px';
  toast.textContent = 'SAVED';
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 2000);
}

  document.getElementById('exercise-name').value = '';

  currentPhotos = [];
  renderPhotoPreview();
  setCount = 3;

}

// === カレンダーページ ===
function changeCalMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  calSelectedDate = null;
  renderCalendar();
}

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = calYear + '年' + (calMonth + 1) + '月';

  var trainDates = {};
  state.records.forEach(function(r) {
    if (!trainDates[r.date]) trainDates[r.date] = {};
    trainDates[r.date][r.part] = true;
  });

  var firstDay = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var prevDays = new Date(calYear, calMonth, 0).getDate();
  var todayStr = fmt(new Date());

  var dows = ['日','月','火','水','木','金','土'];
  var html = '';
  for (var di = 0; di < 7; di++) {
    var dowColor = di === 0 ? 'color:#ff375f' : (di === 6 ? 'color:#64d2ff' : '');
    html += '<div class="cal-dow" style="' + dowColor + '">' + dows[di] + '</div>';
  }

  for (var i = 0; i < firstDay; i++) {
    var prevDay = prevDays - firstDay + 1 + i;
    html += '<div class="cal-day other-month">' + prevDay + '</div>';
  }

  for (var day = 1; day <= daysInMonth; day++) {
    var mm = String(calMonth + 1).padStart(2, '0');
    var dd = String(day).padStart(2, '0');
    var dateStr = calYear + '-' + mm + '-' + dd;
    var isToday = dateStr === todayStr;
    var isSelected = dateStr === calSelectedDate;
    var partsForDay = trainDates[dateStr];
    var dow = new Date(calYear, calMonth, day).getDay();

    var dayClass = 'cal-day';
    if (isToday) dayClass += ' today';
    if (isSelected) dayClass += ' selected';

    var dotsHtml = '<div class="cal-dots">';
    if (partsForDay) {
      var partKeys = Object.keys(partsForDay).slice(0, 4);
      for (var pi = 0; pi < partKeys.length; pi++) {
        var bgColor = getPartColor(partKeys[pi]);
        dotsHtml += '<span style="background:' + bgColor + '"></span>';
      }
    }
    dotsHtml += '</div>';

    var dayStyle = '';
    if (!isSelected) {
      if (dow === 0) dayStyle = 'color:#ff375f;';
      else if (dow === 6) dayStyle = 'color:#64d2ff;';
    }

    html += '<div class="' + dayClass + '" style="' + dayStyle + '" onclick="selectCalDate(\'' + dateStr + '\')">' + day + dotsHtml + '</div>';
  }

  var totalCells = firstDay + daysInMonth;
  var remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (var ri = 1; ri <= remaining; ri++) {
    html += '<div class="cal-day other-month">' + ri + '</div>';
  }

  document.getElementById('cal-grid').innerHTML = html;
  renderCalStreak();

  if (calSelectedDate) {
    renderCalDetail(calSelectedDate);
  } else {
    document.getElementById('cal-detail').innerHTML = '';
  }
}

function selectCalDate(dateStr) {
  calSelectedDate = (calSelectedDate === dateStr) ? null : dateStr;
  renderCalendar();
}

function renderCalDetail(dateStr) {
  var recs = state.records.filter(function(r) { return r.date === dateStr; });
  var c = document.getElementById('cal-detail');
  var d = new Date(dateStr + 'T00:00:00');
  var wNames = ['日','月','火','水','木','金','土'];
  var label = (d.getMonth()+1) + '/' + d.getDate() + '(' + wNames[d.getDay()] + ')';

  if (recs.length === 0) {
    c.innerHTML = '<div class="card">' +
      '<div class="cal-detail-header">' + label + ' <button class="btn btn-primary btn-sm" onclick="goToRecord(\'' + dateStr + '\')">Record</button></div>' +
      '<div class="empty">記録なし</div></div>';
    return;
  }

  var totalVol = 0, totalSets = 0;
  recs.forEach(function(r) {
    totalSets += r.sets.length;
    r.sets.forEach(function(s) { totalVol += s.weight * s.reps; });
  });

  var recsHtml = recs.map(function(r) {
    var setsText = formatSets(r);
    var color = getPartColor(r.part);
    var memoHtml = r.memo ? '<div class="record-memo">' + escHtml(r.memo) + '</div>' : '';
    return '<div class="record-item">' +
      '<div style="display:flex;justify-content:space-between;align-items:start">' +
      '<div><span class="tag" style="background:' + hexToRgba(color, 0.15) + ';color:' + color + '">' + r.part + '</span>' +
      '<span class="record-exercise">' + r.exercise + '</span></div>' +
      '<button class="edit-btn" onclick="openEditModal(' + r.id + ')">&#9998;</button></div>' +
      '<div class="record-detail">' + setsText + '</div>' +
      memoHtml + '</div>';
  }).join('');

  c.innerHTML = '<div class="card">' +
    '<div class="cal-detail-header">' + label + '<button class="btn btn-primary btn-sm" onclick="goToRecord(\'' + dateStr + '\')">Add</button></div>' +
    recsHtml + '</div>';
}

function goToRecord(dateStr) {
  currentDate = new Date(dateStr + 'T00:00:00');
  switchPage('record');
}

function renderCalStreak() {
  var dateSet = {};
  state.records.forEach(function(r) { dateSet[r.date] = true; });
  var dates = Object.keys(dateSet).sort();
  var todayStr = fmt(new Date());

  var currentStreak = 0;
  var d = new Date();
  while (true) {
    var ds = fmt(d);
    if (dateSet[ds]) {
      currentStreak++;
      d.setDate(d.getDate() - 1);
    } else if (ds === todayStr) {
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }

  var maxStreak = 0, streak = 0;
  for (var i = 0; i < dates.length; i++) {
    if (i === 0) {
      streak = 1;
    } else {
      var prev = new Date(dates[i-1] + 'T00:00:00');
      var curr = new Date(dates[i] + 'T00:00:00');
      var diff = (curr - prev) / 86400000;
      streak = (diff === 1) ? streak + 1 : 1;
    }
    if (streak > maxStreak) maxStreak = streak;
  }

  var monthStr = calYear + '-' + String(calMonth+1).padStart(2,'0');
  var monthDatesSet = {};
  state.records.forEach(function(r) {
    if (r.date.indexOf(monthStr) === 0) monthDatesSet[r.date] = true;
  });
  var monthDays = Object.keys(monthDatesSet).length;

  document.getElementById('cal-streak').innerHTML =
    '<div class="cal-streak-item"><div class="cal-streak-num">' + currentStreak + '</div><div class="cal-streak-label">Streak</div></div>' +
    '<div class="cal-streak-item"><div class="cal-streak-num">' + maxStreak + '</div><div class="cal-streak-label">Best</div></div>' +
    '<div class="cal-streak-item"><div class="cal-streak-num">' + monthDays + '</div><div class="cal-streak-label">Month</div></div>';
}

// === 体組成ページ ===
function saveBody() {
  var w = parseFloat(document.getElementById('body-weight').value);
  var f = parseFloat(document.getElementById('body-fat').value);
  if (!w && !f) { alert('体重または体脂肪率を入力してください'); return; }
  state.bodyRecords.push({ id: Date.now(), date: fmt(new Date()), weight: w || null, fat: f || null });
  save();
  document.getElementById('body-weight').value = '';
  document.getElementById('body-fat').value = '';
  renderBody();
}

function renderBody() {
  var recs = state.bodyRecords.slice(-30);
  renderBodyHistory();
  drawLineChart('weight-chart', recs.filter(function(r){return r.weight;}).map(function(r){return {label:r.date.slice(5),value:r.weight};}), 'kg');
  drawLineChart('fat-chart', recs.filter(function(r){return r.fat;}).map(function(r){return {label:r.date.slice(5),value:r.fat};}), '%');
}

function renderBodyHistory() {
  var c = document.getElementById('body-history');
  var recs = state.bodyRecords.slice(-10).reverse();
  if (recs.length === 0) { c.innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
  c.innerHTML = recs.map(function(r) {
    return '<div class="record-item" style="display:flex;justify-content:space-between;align-items:center">' +
      '<div><div class="record-date">' + r.date + '</div><div>' + (r.weight ? r.weight + 'kg' : '-') + ' / ' + (r.fat ? r.fat + '%' : '-') + '</div></div>' +
      '<button class="delete-btn" onclick="deleteBodyRecord(' + r.id + ')">x</button></div>';

function deleteBodyRecord(id) {
  if (!confirm('削除しますか？')) return;
  state.bodyRecords = state.bodyRecords.filter(function(r) { return r.id !== id; });
  save();
  renderBody();
}

// === 履歴ページ ===
function renderHistory() {
  var filterC = document.getElementById('history-filter');
  filterC.innerHTML = '<div class="chip active" onclick="filterHistory(null, this)" style="border-color:var(--primary);color:var(--primary)">ALL</div>' +
    state.parts.map(function(p) {
      var color = getPartColor(p);
      return '<div class="chip" onclick="filterHistory(\'' + p + '\', this)" style="border-color:' + hexToRgba(color, 0.3) + ';color:' + color + '">' + p + '</div>';
    }).join('');
  showFilteredHistory(null);
}

function filterHistory(part, el) {
  document.querySelectorAll('#history-filter .chip').forEach(function(c) { c.classList.remove('active'); });
  if (el) {
    el.classList.add('active');
    if (part) {
      var color = getPartColor(part);
      el.style.background = color;
      el.style.color = '#0a0a0a';
      el.style.borderColor = color;
    } else {
      el.style.background = 'var(--primary)';
      el.style.color = '#0a0a0a';
      el.style.borderColor = 'var(--primary)';
    }
  }
  document.querySelectorAll('#history-filter .chip:not(.active)').forEach(function(c) {
    c.style.background = '#1a1a1a';
    var p = c.textContent;
    if (p === 'ALL') {
      c.style.color = 'var(--primary)';
      c.style.borderColor = 'var(--primary)';
    } else {
      var col = getPartColor(p);
      c.style.color = col;
      c.style.borderColor = hexToRgba(col, 0.3);
    }
  });
  showFilteredHistory(part);
}

function showFilteredHistory(part) {
  var recs = part ? state.records.filter(function(r) { return r.part === part; }) : state.records;
  var grouped = {};
  recs.forEach(function(r) { if (!grouped[r.date]) grouped[r.date] = []; grouped[r.date].push(r); });

  var dates = Object.keys(grouped).sort().reverse();
  var c = document.getElementById('history-list');

  if (dates.length === 0) { c.innerHTML = '<div class="empty">記録がありません</div>'; return; }

  c.innerHTML = dates.slice(0, 30).map(function(date) {
    var items = grouped[date].map(function(r) {
      var setsText = formatSets(r);
      var color = getPartColor(r.part);
      var memoHtml = r.memo ? '<div class="record-memo">' + escHtml(r.memo) + '</div>' : '';
      return '<div class="record-item">' +
        '<div style="display:flex;justify-content:space-between;align-items:start">' +
        '<div><span class="tag" style="background:' + hexToRgba(color, 0.15) + ';color:' + color + '">' + r.part + '</span>' +
        '<span class="record-exercise">' + r.exercise + '</span></div>' +
        '<button class="edit-btn" onclick="openEditModal(' + r.id + ')">&#9998;</button></div>' +
        '<div class="record-detail">' + setsText + '</div>' + memoHtml + '</div>';
    }).join('');
    return '<div class="card"><div class="card-title">' + date + '</div>' + items + '</div>';
  }).join('');
}

// === 統計ページ ===
function renderStats() {
  var now = new Date();
  var monthStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  var monthRecs = state.records.filter(function(r) { return r.date.indexOf(monthStr) === 0; });

  var daySet = {};
  monthRecs.forEach(function(r) { daySet[r.date] = true; });
  var days = Object.keys(daySet).length;
  var totalSets = 0, totalVol = 0;
  var exerciseSet = {};
  monthRecs.forEach(function(r) {
    totalSets += r.sets.length;
    r.sets.forEach(function(s) { totalVol += s.weight * s.reps; });
    exerciseSet[r.exercise] = true;
  });

  document.getElementById('stat-days').textContent = days;
  document.getElementById('stat-sets').textContent = totalSets;
  document.getElementById('stat-volume').textContent = totalVol >= 1000 ? (totalVol/1000).toFixed(1)+'k' : totalVol;
  document.getElementById('stat-exercises').textContent = Object.keys(exerciseSet).length;

  var partVol = {};
  monthRecs.forEach(function(r) {
    var vol = 0;
    r.sets.forEach(function(s) { vol += s.weight * s.reps; });
    partVol[r.part] = (partVol[r.part] || 0) + vol;
  });
  drawBarChart('part-chart', Object.keys(partVol).map(function(k) { return {label: k, value: partVol[k]}; }));

  var weeks = {};
  state.records.slice(-100).forEach(function(r) {
    var d = new Date(r.date + 'T00:00:00');
    var ws = new Date(d);
    ws.setDate(d.getDate() - d.getDay());
    var key = fmt(ws);
    weeks[key] = (weeks[key] || 0) + 1;
  });
  var weekKeys = Object.keys(weeks).sort().slice(-8);
  drawBarChart('weekly-chart', weekKeys.map(function(k) { return {label: k.slice(5), value: weeks[k]}; }));

  var today = new Date();
  var dayOfWeek = today.getDay();
  var mon = new Date(today);
  mon.setDate(today.getDate() - ((dayOfWeek + 6) % 7));
  var sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  var monStr = fmt(mon);
  var sunStr = fmt(sun);
  document.getElementById('week-range').textContent = monStr.slice(5) + ' - ' + sunStr.slice(5);

  var weekRecs = state.records.filter(function(r) { return r.date >= monStr && r.date <= sunStr; });
  var wDays = {};
  var wSets = 0;
  var wVol = 0;
  var wCardio = 0;
  var wParts = {};
  weekRecs.forEach(function(r) {
    wDays[r.date] = true;
    wSets += r.sets.length;
    if (r.part === '有酸素') {
      r.sets.forEach(function(s) { wCardio += (s.weight || 0); });
    } else {
      r.sets.forEach(function(s) { wVol += s.weight * s.reps; });
    }
    wParts[r.part] = true;
  });
  document.getElementById('week-days').textContent = Object.keys(wDays).length;
  document.getElementById('week-sets').textContent = wSets;
  document.getElementById('week-volume').textContent = wVol >= 1000 ? (wVol/1000).toFixed(1)+'k' : wVol;
  document.getElementById('week-cardio').textContent = wCardio;
  var wpEl = document.getElementById('week-parts');
  wpEl.innerHTML = Object.keys(wParts).map(function(p) {
    var color = getPartColor(p);
    return '<span class="tag" style="background:' + hexToRgba(color, 0.15) + ';color:' + color + ';font-size:11px">' + p + '</span>';
  }).join('');
}

// === チャート描画 ===
function drawLineChart(canvasId, data, unit) {
  var canvas = document.getElementById(canvasId);
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  var W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  if (data.length < 2) {
    ctx.fillStyle = '#555'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('データが不足しています', W/2, H/2);
    return;
  }

  var pad = { t: 10, r: 15, b: 30, l: 45 };
  var cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  var vals = data.map(function(d){return d.value;});
  var min = Math.min.apply(null, vals) * 0.98, max = Math.max.apply(null, vals) * 1.02;
  var range = max - min || 1;

  ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
  for (var i = 0; i <= 4; i++) {
    var y = pad.t + (cH / 4) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((max - (range/4)*i).toFixed(1), pad.l - 5, y + 4);
  }

  ctx.beginPath(); ctx.strokeStyle = '#e8ff00'; ctx.lineWidth = 2;
  data.forEach(function(d, i) {
    var x = pad.l + (cW / (data.length - 1)) * i;
    var y2 = pad.t + cH - ((d.value - min) / range) * cH;
    if (i === 0) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
  });
  ctx.stroke();

  data.forEach(function(d, i) {
    var x = pad.l + (cW / (data.length - 1)) * i;
    var y2 = pad.t + cH - ((d.value - min) / range) * cH;
    ctx.beginPath(); ctx.arc(x, y2, 3, 0, Math.PI * 2); ctx.fillStyle = '#e8ff00'; ctx.fill();
  });

  ctx.fillStyle = '#555'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  var step = Math.max(1, Math.floor(data.length / 6));
  data.forEach(function(d, i) {
    if (i % step === 0 || i === data.length-1) {
      ctx.fillText(d.label, pad.l + (cW / (data.length - 1)) * i, H - 8);
    }
  });
}

function drawBarChart(canvasId, data) {
  var canvas = document.getElementById(canvasId);
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  var W = rect.width, H = rect.height;
  ctx.clearRect(0, 0, W, H);

  if (data.length === 0) {
    ctx.fillStyle = '#555'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('データがありません', W/2, H/2);
    return;
  }

  var pad = { t: 10, r: 15, b: 35, l: 15 };
  var cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  var maxVal = Math.max.apply(null, data.map(function(d){return d.value;})) * 1.1 || 1;
  var barW = Math.min(40, (cW / data.length) * 0.6);
  var gap = cW / data.length;

  data.forEach(function(d, i) {
    var x = pad.l + gap * i + (gap - barW) / 2;
    var h = (d.value / maxVal) * cH;
    var y = pad.t + cH - h;
    var r = 4;
    var barColor = getPartColor(d.label);

    ctx.fillStyle = barColor;
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + barW - r, y);
    ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
    ctx.lineTo(x + barW, pad.t + cH); ctx.lineTo(x, pad.t + cH);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.fill();

    ctx.fillStyle = '#f0f0f0'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(d.value >= 1000 ? (d.value/1000).toFixed(1)+'k' : Math.round(d.value), x + barW/2, y - 5);
    ctx.fillStyle = '#777'; ctx.font = '10px sans-serif';
    ctx.fillText(d.label, x + barW/2, H - 8);
  });
}

// === データ管理 ===
function exportData() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bulk-tracker-' + fmt(new Date()) + '.json';
  a.click();
}

function importData(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    if (!confirm('現在のデータを上書きしますか？')) return;
    try {
      state = JSON.parse(e.target.result);
      save();
      location.reload();
    } catch(err) { alert('無効なファイルです'); }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('全てのデータを削除しますか？この操作は取り消せません。')) return;
  if (!confirm('本当に削除しますか？')) return;
  localStorage.removeItem(DB_KEY);
  location.reload();
}

// === ヘルスケア連携 ===
function checkHealthImport() {
  var params = new URLSearchParams(window.location.search);
  var weight = parseFloat(params.get('weight'));
  var fat = parseFloat(params.get('fat'));

  if (!weight && !fat) return;

  var today = fmt(new Date());
  var alreadyExists = state.bodyRecords.some(function(r) {
    return r.date === today && r.weight === weight && r.fat === fat;
  });
  if (alreadyExists) return;

  state.bodyRecords.push({
    id: Date.now(),
    date: today,
    weight: weight || null,
    fat: fat || null,
    source: 'healthkit'
  });
  save();

  var msg = 'ヘルスケアから取り込みました：';
  if (weight) msg += ' 体重 ' + weight + 'kg';
  if (fat) msg += ' 体脂肪率 ' + fat + '%';

  var toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--primary);color:#0a0a0a;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:800;z-index:300;animation:fadeout 3s forwards;max-width:90%;text-align:center';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);

  window.history.replaceState({}, '', window.location.pathname);
  switchPage('body');
}

// === 初期化 ===
renderRecordPage();
checkHealthImport();
